<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAWG Game Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>RAWG Game Explorer</h1>
    <button type="button" id="view-backlog-btn">My Backlog</button>
  </header>

  <form id="search-form">
    <input type="text" id="search-input" placeholder="Search games...">
    <select id="genre-select">
      <option value="">All Genres</option>
      <option value="action">Action</option>
      <option value="rpg">RPG</option>
      <option value="strategy">Strategy</option>
      <option value="indie">Indie</option>
    </select>
    <select id="ordering-select">
      <option value="">Relevance</option>
      <option value="-rating">Highest Rated</option>
      <option value="-released">Newest Released</option>
    </select>
    <button type="submit">Search</button>
  </form>

  <div id="loader" hidden>Loading...</div>
  <div id="error" hidden></div>
  <div id="results"></div>
  <section id="detail" hidden></section>
  <section id="backlog" hidden></section>

  <script src="script.js"></script>
</body>
</html>
