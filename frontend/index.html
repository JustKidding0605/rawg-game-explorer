<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAWG Game Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>RAWG Game Explorer</h1>
  <form id="search-form">
    <button type="button" id="view-backlog">My Backlog</button>
    <input type="text" id="search-input" placeholder="Search games...">
    <button type="submit">Search</button>  
  </form>
  <div id="loader" hidden>Loading...</div>
  <div id="error" hidden></div>
  <div id="results"></div>
  <section id="detail" hidden></section>
  <section id="backlog" hidden></section>
  <script src="script.js"></script>
</body>
</html>
